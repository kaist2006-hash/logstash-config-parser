# Logstash 8.17.x - card detail parsing validation candidate

input {
  beats {
    port => 8801
  }
}

filter {
  mutate {
    remove_field => ["[event][original]", "agent", "[host][architecture]", "[host][mac]", "[host][id]", "[host][ip]", "[host][containerized]", "[host][os]"]
  }

  # Text envelope cards: get=IN, put=OUT
  if [message] =~ /(get|put)\(/ and "linename" in [message] {
    dissect { mapping => { "message" => "%{a_header}] %{b_body}" } }
    grok { match => { "a_header" => "^\(I\)\s*[^:]+:[^:]+:[^:]+:(?<gateway>[^:]+):.*?\.c:(?<status>get|put)" } }
    mutate { gsub => [ "b_body", "^get", "IN", "b_body", "^put", "OUT", "status", "^get", "IN", "status", "^put", "OUT" ] }
  }
  else if [message] =~ "get\(" or [message] =~ "put\(" {
    dissect { mapping => { "message" => "%{a_header}* %{b_body}" } }
    grok { match => { "a_header" => "^\(I\)\s*[^:]+:[^:]+:[^:]+:(?<gateway>[^:]+):.*?\.c:(?<status>get|put)" } }
    mutate { gsub => [ "b_body", "^get", "IN", "b_body", "^put", "OUT", "status", "^get", "IN", "status", "^put", "OUT" ] }
  }
  # Hex envelope cards: S=OUT, R=IN
  else if "==>" in [message] and [message] =~ "\[[SR]\]" {
    dissect { mapping => { "message" => "%{a_header}==>%{b_body}" } }
    grok { match => { "a_header" => "^\(I\)\s*[^:]+:[^:]+:[^:]+:%{DATA:gateway}:" } }
    if [a_header] =~ "\[S\]" {
      mutate { replace => { "b_body" => "[OUT] %{b_body}" } add_field => { "status" => "OUT" } }
    }
    else if [a_header] =~ "\[R\]" {
      mutate { replace => { "b_body" => "[IN] %{b_body}" } add_field => { "status" => "IN" } }
    }
  }
  else {
    drop { }
  }

  # Route to one card profile. Index aliases are unchanged from the existing card.conf.
  if [log][file][path] =~ /GCCNB_X25A_P01/ { mutate { add_field => { "[@metadata][target_alias]" => "s_service_cnb_ms" } } }
  else if [log][file][path] =~ /GICNB_X25A_P01/ { mutate { add_field => { "[@metadata][target_alias]" => "s_service_cnb_ic" } } }
  else if [log][file][path] =~ /GCLGC_X25A_P01/ { mutate { add_field => { "[@metadata][target_alias]" => "s_service_lgc_ms" } } }
  else if [log][file][path] =~ /GILGC_X25A_P01/ { mutate { add_field => { "[@metadata][target_alias]" => "s_service_lgc_ic" } } }
  else if [log][file][path] =~ /GCLTC_X25A_P01/ { mutate { add_field => { "[@metadata][target_alias]" => "s_service_ltc_ms" } } }
  else if [log][file][path] =~ /GILTC_X25A_P01/ { mutate { add_field => { "[@metadata][target_alias]" => "s_service_ltc_ic" } } }
  else if [log][file][path] =~ /GINST_0005_A01/ { mutate { add_field => { "[@metadata][target_alias]" => "s_service_win_ms" } } }
  else if [log][file][path] =~ /GIWIN_X25A_P01/ { mutate { add_field => { "[@metadata][target_alias]" => "s_service_win_ic" } } }
  else if [log][file][path] =~ /GIKEB_X25A_P01/ { mutate { add_field => { "[@metadata][target_alias]" => "s_service_keb_sum" } } }
  else if [log][file][path] =~ /GINST_0008_A01/ { mutate { add_field => { "[@metadata][target_alias]" => "s_service_din_ms" } } }
  else if [log][file][path] =~ /GINST_0009_A01/ { mutate { add_field => { "[@metadata][target_alias]" => "s_service_din_ic" } } }
  else if [log][file][path] =~ /GINST_0003_A10/ { mutate { add_field => { "[@metadata][target_alias]" => "s_service_nlc_ms" } } }
  else if [log][file][path] =~ /GINST_0004_A10/ { mutate { add_field => { "[@metadata][target_alias]" => "s_service_nlc_ic" } } }
  else if [log][file][path] =~ /GIWRC_X25A_P01/ { mutate { add_field => { "[@metadata][target_alias]" => "s_service_wrc_sum" } } }
  else if [log][file][path] =~ /GCBCC_X25A_P01/ { mutate { add_field => { "[@metadata][target_alias]" => "s_service_bcc_ms" } } }
  else if [log][file][path] =~ /GIBCC_X25A_P01/ { mutate { add_field => { "[@metadata][target_alias]" => "s_service_bcc_ic" } } }

  # Parser config is loaded and compiled once in register(). No per-event JSON/file I/O.
  # Default enablement stays limited to the two profiles validated with real logs.
  ruby {
    id => "card_detail_parser_v2"
    path => "${CARD_PARSER_DIR}/card_detail_parser_v2.rb"
    script_params => {
      "specs_path" => "${CARD_PARSER_DIR}/card_detail_specs.json"
      "overlay_path" => "${CARD_PARSER_DIR}/card_detail_specs_taps_overlay.json"
      "enabled_profiles" => "${CARD_ENABLED_PROFILES:kb_ic,lotte_ms}"
      "text_encoding" => "${CARD_TEXT_ENCODING:UTF-8}"
      "max_message_bytes" => 65536
    }
    tag_on_exception => "_card_detail_exception"
  }

  # ---------------------------------------------------------------------------
  # Common output fields
  # ---------------------------------------------------------------------------
  # Keep the original parser fields for backward compatibility and COPY values
  # to the common names used by the BGF parser where semantics are equivalent.
  # This block does not change ISO8583 parsing offsets, bitmap interpretation or
  # frame status; it only standardizes the output field paths.
  if [card_detail][profile] {
    mutate {
      add_field => { "[card_detail][parser_type]" => "card_iso8583" }
      copy => {
        "[card_detail][profile]" => "[card_detail][format]"
        "[card_detail][payload_bytes]" => "[card_detail][message_length]"
        "[card_detail][issuer]" => "[card_detail][detail][issuer_name]"

        "[card_detail][fields][amount]" => "[card_detail][detail][transaction_amount]"
        "[card_detail][fields][installments]" => "[card_detail][detail][installment_months]"
        "[card_detail][fields][tax_amount]" => "[card_detail][detail][tax_amount]"
        "[card_detail][fields][service_amount]" => "[card_detail][detail][service_charge]"
        "[card_detail][fields][approval_code]" => "[card_detail][detail][approval_number]"
        "[card_detail][fields][original_approval_code]" => "[card_detail][detail][original_approval_number]"
        "[card_detail][fields][merchant_id]" => "[card_detail][detail][merchant_number]"
        "[card_detail][fields][acquirer_id]" => "[card_detail][detail][acquirer_code]"
        "[card_detail][fields][terminal_id]" => "[card_detail][cat_id]"
        "[card_detail][fields][response_code]" => "[card_detail][response_code]"

        "[card_detail][fields][processing_code]" => "[card_detail][iso8583][processing_code]"
        "[card_detail][fields][transmission_datetime]" => "[card_detail][iso8583][transmission_datetime]"
        "[card_detail][fields][trace_number]" => "[card_detail][iso8583][trace_number]"
        "[card_detail][fields][local_time]" => "[card_detail][iso8583][local_time]"
        "[card_detail][fields][local_date]" => "[card_detail][iso8583][local_date]"
        "[card_detail][fields][merchant_type]" => "[card_detail][iso8583][merchant_type]"
        "[card_detail][fields][acquirer_country]" => "[card_detail][iso8583][acquirer_country]"
        "[card_detail][fields][pos_entry_mode]" => "[card_detail][iso8583][pos_entry_mode]"
        "[card_detail][fields][card_sequence]" => "[card_detail][iso8583][card_sequence]"
        "[card_detail][fields][pos_condition]" => "[card_detail][iso8583][pos_condition]"
        "[card_detail][fields][retrieval_reference]" => "[card_detail][iso8583][retrieval_reference]"
        "[card_detail][fields][currency_code]" => "[card_detail][iso8583][currency_code]"
        "[card_detail][fields][network_code]" => "[card_detail][iso8583][network_code]"
        "[card_detail][fields][original_mti]" => "[card_detail][iso8583][original_mti]"
        "[card_detail][fields][original_trace]" => "[card_detail][iso8583][original_trace]"
        "[card_detail][fields][original_date]" => "[card_detail][iso8583][original_date]"

        "[card_detail][fields][settlement_amount]" => "[card_detail][detail][settlement_amount]"
        "[card_detail][fields][billing_amount]" => "[card_detail][detail][billing_amount]"
        "[card_detail][fields][point_balance]" => "[card_detail][detail][point_balance]"
        "[card_detail][fields][business_id]" => "[card_detail][detail][business_id]"
        "[card_detail][fields][domestic_merchant_id]" => "[card_detail][detail][domestic_merchant_number]"
        "[card_detail][fields][domestic_country]" => "[card_detail][detail][domestic_country]"
        "[card_detail][fields][pg_business_id]" => "[card_detail][detail][pg_business_id]"
        "[card_detail][fields][deposit_sale_type]" => "[card_detail][detail][deposit_sale_type]"
        "[card_detail][fields][deposit_amount]" => "[card_detail][detail][deposit_amount]"
        "[card_detail][fields][merchant_fee_rate_raw]" => "[card_detail][detail][merchant_fee_rate_raw]"

        "[card_detail][fields][fallback_reason]" => "[card_detail][terminal][fallback_reason]"
        "[card_detail][fields][encrypted_card_transport]" => "[card_detail][terminal][encrypted_card_transport]"
        "[card_detail][fields][terminal_software_model]" => "[card_detail][terminal][software_model]"
        "[card_detail][fields][terminal_reader_model]" => "[card_detail][terminal][reader_model]"
      }
    }

    # Match BGF numeric common-field intent. Missing fields are ignored.
    mutate {
      convert => {
        "[card_detail][message_length]" => "integer"
        "[card_detail][detail][transaction_amount]" => "integer"
        "[card_detail][detail][installment_months]" => "integer"
        "[card_detail][detail][tax_amount]" => "integer"
        "[card_detail][detail][service_charge]" => "integer"
        "[card_detail][detail][settlement_amount]" => "integer"
        "[card_detail][detail][billing_amount]" => "integer"
        "[card_detail][detail][point_balance]" => "integer"
        "[card_detail][detail][deposit_amount]" => "integer"
      }
    }
  }
}

output {
  if [@metadata][target_alias] {
    elasticsearch {
      hosts => ["${CARD_ES_HOST_1}", "${CARD_ES_HOST_2}", "${CARD_ES_HOST_3}"]
      user => "elastic"
      password => "${CARD_ES_PASSWORD}"
      index => "%{[@metadata][target_alias]}"
      ilm_enabled => false
      manage_template => false
    }
  }
}
