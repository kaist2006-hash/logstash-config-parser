# Offline file replay only. Do not put this file in the operating pipeline glob.
input {
  file {
    path => ["${CARD_TEST_INPUT_DIR}/*.log"]
    mode => "read"
    exit_after_read => true
    sincedb_path => "${CARD_TEST_DIR}/sincedb-${CARD_TEST_RUN}"
    file_completed_action => "log"
    file_completed_log_path => "${CARD_TEST_DIR}/completed-${CARD_TEST_RUN}.txt"
    codec => plain { charset => "ISO-8859-1" }
    ecs_compatibility => "v8"
  }
}
filter {

  mutate {
    remove_field => ["[event][original]", "agent","[host][architecture]", "[host][mac]", "[host][id]", "[host][ip]", "[host][containerized]","[host][os]"]
  }

  if [message] =~ /(get|put)\(/ and "linename" in [message] {
    dissect {
      mapping => {
        "message" => "%{a_header}] %{b_body}"
      }
    }
    grok {
      match => {
        "a_header" => "^\(I\)\s*[^:]+:[^:]+:[^:]+:(?<gateway>[^:]+):.*?\.c:(?<status>get|put)"
      }
    }
    mutate {
      gsub => [
        "b_body", "^get", "IN",
        "b_body", "^put", "OUT",
        "status", "^get", "IN",
        "status", "^put", "OUT"
      ]
    }
  }

  else if [message] =~ "get\(" or [message] =~ "put\(" {
    dissect {
      mapping => {
        "message" => "%{a_header}* %{b_body}"
      }
    }
    grok {
      match => {
        "a_header" => "^\(I\)\s*[^:]+:[^:]+:[^:]+:(?<gateway>[^:]+):.*?\.c:(?<status>get|put)"
      }
    }
    mutate {
      gsub => [
        "b_body", "^get", "IN",
        "b_body", "^put", "OUT",
        "status", "^get", "IN",
        "status", "^put", "OUT"
      ]
    }
  }

  else if "==>" in [message] and [message] =~ "\[[SR]\]" {
    dissect {
      mapping => {
        "message" => "%{a_header}==>%{b_body}"
      }
    }
    grok {
      match => {
        "a_header" => "^\(I\)\s*[^:]+:[^:]+:[^:]+:%{DATA:gateway}:"
      }
    }
    if [a_header] =~ "\[S\]" {
      mutate {
        replace => { "b_body" => "[OUT] %{b_body}" }
        add_field => { "status" => "OUT" }
      }
    }
    else if [a_header] =~ "\[R\]" {
      mutate {
        replace => { "b_body" => "[IN] %{b_body}" }
        add_field => { "status" => "IN" }
      }
    }
  }
  else {
    drop { }
  }

  if [log][file][path] =~ /GCCNB_X25A_P01/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_service_cnb_ms" }
    }
  } else if [log][file][path] =~ /GICNB_X25A_P01/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_service_cnb_ic" }
    }
  } else if [log][file][path] =~ /GCLGC_X25A_P01/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_service_lgc_ms" }
    }
  } else if [log][file][path] =~ /GILGC_X25A_P01/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_service_lgc_ic" }
    }
  } else if [log][file][path] =~ /GCLTC_X25A_P01/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_service_ltc_ms" }
    }
  } else if [log][file][path] =~ /GILTC_X25A_P01/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_service_ltc_ic" }
    }
  } else if [log][file][path] =~ /GINST_0005_A01/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_service_win_ms" }
    }
  } else if [log][file][path] =~ /GIWIN_X25A_P01/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_service_win_ic" }
    }
  } else if [log][file][path] =~ /GIKEB_X25A_P01/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_service_keb_sum" }
    }
  } else if [log][file][path] =~ /GINST_0008_A01/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_service_din_ms" }
    }
  } else if [log][file][path] =~ /GINST_0009_A01/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_service_din_ic" }
    }
  } else if [log][file][path] =~ /GINST_0003_A10/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_service_nlc_ms" }
    }
  } else if [log][file][path] =~ /GINST_0004_A10/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_service_nlc_ic" }
    }
  } else if [log][file][path] =~ /GIWRC_X25A_P01/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_service_wrc_sum" }
    }
  } else if [log][file][path] =~ /GCBCC_X25A_P01/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_service_bcc_ms" }
    }
  } else if [log][file][path] =~ /GIBCC_X25A_P01/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_service_bcc_ic" }
    }
  }

  # Additive detail parser: raw message is used; existing a_header/b_body remain unchanged.
  ruby {
    id => "card_detail_parser_v1"
    path => "${CARD_PARSER_DIR}/card_detail_parser.rb"
    script_params => {
      "specs_path" => "${CARD_PARSER_DIR}/card_detail_specs.json"
      "text_encoding" => "${CARD_TEXT_ENCODING:UTF-8}"
      "max_message_bytes" => 65536
    }
    tag_on_exception => "_card_detail_exception"
  }
}


filter {
  ruby {
    code => 'event.to_hash.keys.each { |k| event.remove(k) unless k == "card_detail" || k == "tags" }'
  }
}
output {
  file {
    path => "${CARD_TEST_DIR}/detail-${CARD_TEST_RUN}.jsonl"
    codec => json_lines
  }
}
