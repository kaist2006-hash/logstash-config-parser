# Logstash 8.17.x - final card detail parser candidate
#
# Flow:
#   message -> a_header / b_body -> status(IN/OUT)
#   path -> card_profile + target_alias
#   Ruby -> card_detail_specs.json
#   numeric fields -> convert

input {
  beats {
    port => 8801
  }
}

filter {
  mutate {
    remove_field => ["[event][original]", "agent", "[host][architecture]", "[host][mac]", "[host][id]", "[host][ip]", "[host][containerized]", "[host][os]"]
  }

  # Text envelope: get=IN / put=OUT
  if [message] =~ /(get|put)\(/ and "linename" in [message] {
    dissect { mapping => { "message" => "%{a_header}] %{b_body}" } }
    grok { match => { "a_header" => "^\(I\)\s*[^:]+:[^:]+:[^:]+:(?<gateway>[^:]+):.*?\.c:(?<status>get|put)" } }
    mutate { gsub => [ "status", "^get$", "IN", "status", "^put$", "OUT" ] }
  }
  else if [message] =~ "get\(" or [message] =~ "put\(" {
    dissect { mapping => { "message" => "%{a_header}* %{b_body}" } }
    grok { match => { "a_header" => "^\(I\)\s*[^:]+:[^:]+:[^:]+:(?<gateway>[^:]+):.*?\.c:(?<status>get|put)" } }
    mutate { gsub => [ "status", "^get$", "IN", "status", "^put$", "OUT" ] }
  }

  # Hex envelope: S=OUT / R=IN
  else if "==>" in [message] and [message] =~ "\[[SR]\]" {
    dissect { mapping => { "message" => "%{a_header}==>%{b_body}" } }
    grok { match => { "a_header" => "^\(I\)\s*[^:]+:[^:]+:[^:]+:%{DATA:gateway}:" } }

    if [a_header] =~ "\[S\]" {
      mutate { add_field => { "status" => "OUT" } }
    }
    else if [a_header] =~ "\[R\]" {
      mutate { add_field => { "status" => "IN" } }
    }
  }
  else {
    drop { }
  }

  # Card-company routing
  # card_profile: parser profile / target_alias: Elasticsearch output alias
  if [log][file][path] =~ /GCCNB_X25A_P01/ {
    mutate { add_field => { "[@metadata][card_profile]" => "kb_ms" "[@metadata][target_alias]" => "s_service_cnb_ms" } }
  }
  else if [log][file][path] =~ /GICNB_X25A_P01/ {
    mutate { add_field => { "[@metadata][card_profile]" => "kb_ic" "[@metadata][target_alias]" => "s_service_cnb_ic" } }
  }
  else if [log][file][path] =~ /GCLGC_X25A_P01/ {
    mutate { add_field => { "[@metadata][card_profile]" => "shinhan_ms" "[@metadata][target_alias]" => "s_service_lgc_ms" } }
  }
  else if [log][file][path] =~ /GILGC_X25A_P01/ {
    mutate { add_field => { "[@metadata][card_profile]" => "shinhan_ic" "[@metadata][target_alias]" => "s_service_lgc_ic" } }
  }
  else if [log][file][path] =~ /GCLTC_X25A_P01/ {
    mutate { add_field => { "[@metadata][card_profile]" => "lotte_ms" "[@metadata][target_alias]" => "s_service_ltc_ms" } }
  }
  else if [log][file][path] =~ /GILTC_X25A_P01/ {
    mutate { add_field => { "[@metadata][card_profile]" => "lotte_ic" "[@metadata][target_alias]" => "s_service_ltc_ic" } }
  }
  else if [log][file][path] =~ /GINST_0005_A01/ {
    mutate { add_field => { "[@metadata][card_profile]" => "samsung_ms" "[@metadata][target_alias]" => "s_service_win_ms" } }
  }
  else if [log][file][path] =~ /GIWIN_X25A_P01/ {
    mutate { add_field => { "[@metadata][card_profile]" => "samsung_ic" "[@metadata][target_alias]" => "s_service_win_ic" } }
  }
  else if [log][file][path] =~ /GIKEB_X25A_P01/ {
    mutate { add_field => { "[@metadata][card_profile]" => "hana_sum" "[@metadata][target_alias]" => "s_service_keb_sum" } }
  }
  else if [log][file][path] =~ /GINST_0008_A01/ {
    mutate { add_field => { "[@metadata][card_profile]" => "hyundai_ms" "[@metadata][target_alias]" => "s_service_din_ms" } }
  }
  else if [log][file][path] =~ /GINST_0009_A01/ {
    mutate { add_field => { "[@metadata][card_profile]" => "hyundai_ic" "[@metadata][target_alias]" => "s_service_din_ic" } }
  }
  else if [log][file][path] =~ /GINST_0003_A10/ {
    mutate { add_field => { "[@metadata][card_profile]" => "nh_ms" "[@metadata][target_alias]" => "s_service_nlc_ms" } }
  }
  else if [log][file][path] =~ /GINST_0004_A10/ {
    mutate { add_field => { "[@metadata][card_profile]" => "nh_ic" "[@metadata][target_alias]" => "s_service_nlc_ic" } }
  }
  else if [log][file][path] =~ /GIWRC_X25A_P01/ {
    mutate { add_field => { "[@metadata][card_profile]" => "woori_sum" "[@metadata][target_alias]" => "s_service_wrc_sum" } }
  }

  if [@metadata][card_profile] {
    ruby {
      path => "${CARD_PARSER_DIR}/card_detail_parser.rb"
      script_params => {
        "specs_path" => "${CARD_PARSER_DIR}/card_detail_specs.json"
      }
    }

    if [card_detail][profile] {
      mutate {
        convert => {
          "[card_detail][fields][transaction_amount]" => "integer"
          "[card_detail][fields][settlement_amount]" => "integer"
          "[card_detail][fields][billing_amount]" => "integer"
          "[card_detail][fields][point_balance]" => "integer"
          "[card_detail][fields][installment_months]" => "integer"
          "[card_detail][fields][tax_amount]" => "integer"
          "[card_detail][fields][service_charge]" => "integer"
          "[card_detail][fields][deposit_amount]" => "integer"
        }
      }
    }
  }
}

output {
  if [@metadata][target_alias] {
    elasticsearch {
      hosts => ["${CARD_ES_HOST_1}", "${CARD_ES_HOST_2}", "${CARD_ES_HOST_3}"]
      user => "elastic"
      password => "${CARD_ES_PASSWORD}"
      index => "%{[@metadata][target_alias]}"
      ilm_enabled => false
      manage_template => false
    }
  }
}
