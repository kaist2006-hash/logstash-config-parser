# FINAL20: header-based profile selection and one shared text-wrapper split.
# Logstash 8.17.x - FINAL20 card detail parser reference
#
# Runtime files in the same CARD_PARSER_DIR:
#   card.conf
#   card_detail_parser.rb
#   card_detail_specs.json
#
# Issuer profiles remain independent. Samsung MS supports get(data[...])
# responses and put_msg_complete[...] requests in the supplied real logs.

input {
  beats {
    port => 8801
  }
}

filter {
  mutate {
    remove_field => ["[event][original]", "agent", "[host][architecture]", "[host][mac]", "[host][id]", "[host][ip]", "[host][containerized]", "[host][os]"]
  }

  # Split the outer logger prefix from the wire wrapper, not at a payload closing bracket.
  if [message] =~ /\b(?:get|put)(?:_msg_complete)?(?:\(|\[)/ {
    grok {
      overwrite => ["a_header", "b_body", "gateway", "status"]
      match => { "message" => "^(?<a_header>\([A-Za-z]\)\s*:\s*[^:\r\n]+:[^:\r\n]+:(?<gateway>[^:\r\n]+):[^:\r\n]+:[^:\r\n]+:[0-9]+:(?:\s*linename\[[^\]\r\n]*\])?)(?:\s*\*\s*|\s+)?(?<b_body>(?<status>get|put)(?:_msg_complete)?(?:\(|\[)[\s\S]*)\z" }
    }
    mutate { gsub => [ "b_body", "^get", "IN", "b_body", "^put", "OUT", "status", "^get", "IN", "status", "^put", "OUT" ] }
  }
  # Hex envelope: S=OUT / R=IN
  else if "==>" in [message] and [message] =~ "\[[SR]\]" {
    dissect { mapping => { "message" => "%{a_header}==>%{b_body}" } }
    grok { match => { "a_header" => "^\(I\)\s*[^:]+:[^:]+:[^:]+:%{DATA:gateway}:" } }
    if [a_header] =~ "\[S\]" {
      mutate { replace => { "b_body" => "[OUT] %{b_body}" } add_field => { "status" => "OUT" } }
    }
    else if [a_header] =~ "\[R\]" {
      mutate { replace => { "b_body" => "[IN] %{b_body}" } add_field => { "status" => "IN" } }
    }
  }
  else {
    drop { }
  }

  # Ruby selects the issuer/service from the original logger gateway using JSON gateways.
  # JSON is loaded/validated/compiled once in Ruby register().
  # Common field names are defined directly by each JSON emit value.
  ruby {
    id => "card_detail_parser"
    path => "${CARD_PARSER_DIR}/card_detail_parser.rb"
    script_params => {
      "specs_path" => "${CARD_PARSER_DIR}/card_detail_specs.json"
    }
  }

  # Only true numeric business fields are converted.
  # Codes, identifiers, dates and times stay strings to preserve leading zeroes.
  if [card_detail][profile] {
    mutate {
      convert => {
        "[card_detail][fields][transaction_amount]" => "integer"
        "[card_detail][fields][settlement_amount]" => "integer"
        "[card_detail][fields][billing_amount]" => "integer"
        "[card_detail][fields][point_balance]" => "integer"
        "[card_detail][fields][installment_months]" => "integer"
        "[card_detail][fields][tax_amount]" => "integer"
        "[card_detail][fields][service_charge]" => "integer"
        "[card_detail][fields][deposit_amount]" => "integer"
      }
    }
  }
}

output {
  if [@metadata][target_alias] {
    elasticsearch {
      hosts => ["${CARD_ES_HOST_1}", "${CARD_ES_HOST_2}", "${CARD_ES_HOST_3}"]
      user => "elastic"
      password => "${CARD_ES_PASSWORD}"
      index => "%{[@metadata][target_alias]}"
      ilm_enabled => false
      manage_template => false
    }
  }
}
