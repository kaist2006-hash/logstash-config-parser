input {
  beats {
    port => 8805
  }
}

filter {
  if [log][file][path] =~ /(BackMessageMgr|BackChannelMgr|FrontChannelMgr|FrontMessageMgr|JeusServer)/ and
     [message] =~ /^\d{8} \d{2}:\d{2}:\d{2},\d{3}\t/ {
    grok {
      match => {
        "message" => "^\d{8} \d{2}:\d{2}:\d{2},\d{3}\t%{DATA:nice_number}\t(?:INFO|TRACE|DEBUG|FATAL|WARN|ERROR)\s*\t"
      }
    }
  }

  # Keep the existing response-code extraction and root field unchanged.
  if [log][file][path] !~ /(JeusServer|BackChannelMgr|BackMessageMgr)/ and
     " <-- " in [message] and
     "|" in [message] {
    dissect {
      mapping => {
        "message" => "%{}|%{[@metadata][after_pipe]}"
      }
    }
    grok {
      match => {
        "[@metadata][after_pipe]" => "^.{116}(?<code>.{4})"
      }
    }
  }

  # The Ruby parser enriches ChannelMgr transaction lines only. Operational
  # messages, stack traces, MessageMgr and JeusServer events stay untouched.
  if [log][file][path] =~ /(FrontChannelMgr|BackChannelMgr)/ {
    ruby {
      path => "${FRONTBACK_PARSER_DIR}/frontback_detail_parser.rb"
      script_params => {
        "specs_path" => "${FRONTBACK_PARSER_DIR}/frontback_detail_specs.json"
        "source_encoding" => "${FRONTBACK_SOURCE_ENCODING:UTF-8}"
        "max_message_bytes" => 131072
      }
    }
  }

  if [log][file][path] =~ /FrontMessageMgr/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_taps_frontmessage" }
    }
  } else if [log][file][path] =~ /FrontChannelMgr/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_taps_frontchannel" }
    }
  } else if [log][file][path] =~ /BackMessageMgr/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_taps_backmessage" }
    }
  } else if [log][file][path] =~ /BackChannelMgr/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_taps_backchannel" }
    }
  } else if [log][file][path] =~ /JeusServer/ {
    mutate {
      add_field => { "[@metadata][target_alias]" => "s_taps_jeuslog" }
    }
  }

  mutate {
    remove_field => [
      "[event][original]",
      "agent",
      "[host][architecture]",
      "[host][mac]",
      "[host][id]",
      "[host][ip]",
      "[host][containerized]",
      "[host][os]"
    ]
  }
}

output {
  if [@metadata][target_alias] {
    elasticsearch {
      hosts => [
        "${FRONTBACK_ES_HOST_1}",
        "${FRONTBACK_ES_HOST_2}",
        "${FRONTBACK_ES_HOST_3}"
      ]
      user => "${FRONTBACK_ES_USER:elastic}"
      password => "${FRONTBACK_ES_PASSWORD}"
      index => "%{[@metadata][target_alias]}"
      ilm_enabled => false
      manage_template => false
    }
  }
}
